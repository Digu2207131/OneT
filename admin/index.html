<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPAL Lab – Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f0faf5 0%, #e8f5e9 100%);
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .logo { font-size: 48px; margin-bottom: 10px; }
        h1 { color: #064A32; font-size: 24px; }
        p { color: #6c757d; font-size: 14px; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 15px;
        }
        input:focus { border-color: #0A6847; outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background: #0A6847;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #064A32; }
        .error { color: #dc3545; font-size: 13px; margin-bottom: 10px; display: none; }
        .hint { font-size: 12px; color: #aaa; margin-top: 15px; }
        .hint strong { color: #0A6847; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🔐</div>
        <h1>SPAL Admin</h1>
        <p>Enter password to manage content</p>

        <div class="error" id="errorMsg">❌ Wrong password!</div>
        <input type="password" id="adminPass" placeholder="Enter password" />
        <button onclick="login()">Login</button>

        <div class="hint">
            Default: <strong>spal2025</strong>
        </div>
    </div>

    <script>
        function login() {
            const pass = document.getElementById('adminPass').value;
            const error = document.getElementById('errorMsg');
            let stored = localStorage.getItem('admin_password');
            if (!stored) {
                localStorage.setItem('admin_password', 'spal2025');
                stored = 'spal2025';
            }
            if (pass === stored) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'dashboard.html';
            } else {
                error.style.display = 'block';
                setTimeout(() => { error.style.display = 'none'; }, 3000);
            }
        }
        document.getElementById('adminPass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>

</body>
</html>
