<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPAL Admin – Full Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }

        .header { background: #0A6847; color: white; padding: 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .header h1 { font-size: 24px; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; font-size: 14px; }
        .btn-save { background: #FFC107; color: #333; }
        .btn-save:hover { background: #e0a800; }
        .btn-export { background: #17a2b8; color: white; }
        .btn-export:hover { background: #138496; }
        .btn-import { background: #6f42c1; color: white; }
        .btn-import:hover { background: #5a32a3; }
        .btn-view { background: white; color: #0A6847; }
        .btn-view:hover { background: #e0e0e0; }
        .btn-logout { background: #dc3545; color: white; }
        .btn-logout:hover { background: #c82333; }

        .section { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section h2 { margin-bottom: 15px; color: #0A6847; border-bottom: 2px solid #e8f5e9; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

        .field { margin-bottom: 12px; }
        .field label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 14px; }
        .field input, .field textarea, .field select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; font-family: Arial, sans-serif; }
        .field textarea { min-height: 60px; resize: vertical; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .item-list { margin-top: 10px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #f9f9f9; border-radius: 5px; margin-bottom: 5px; border: 1px solid #eee; }
        .item .info { flex: 1; display: flex; align-items: center; gap: 12px; }
        .item .info img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #0A6847; background: #e8f5e9; }
        .item .info .text { flex: 1; }
        .item .info .text strong { font-size: 14px; display: block; }
        .item .info .text .detail { font-size: 12px; color: #666; }
        .item .actions { display: flex; gap: 5px; }
        .item .actions button { padding: 4px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-edit { background: #ffc107; color: #333; }
        .btn-edit:hover { background: #e0a800; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-delete:hover { background: #c82333; }
        .btn-add { background: #0A6847; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-add:hover { background: #064A32; }

        .category-badge { display: inline-block; padding: 2px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .category-badge.current { background: #e8f5e9; color: #0A6847; }
        .category-badge.alumni { background: #fff3e0; color: #e65100; }

        .image-preview { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 2px solid #0A6847; margin-top: 5px; }
        .image-upload-wrapper { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .image-upload-wrapper input[type="file"] { padding: 8px; border: 1px dashed #0A6847; border-radius: 5px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 15px; color: #0A6847; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
        .modal-actions button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-modal-save { background: #0A6847; color: white; }
        .btn-modal-save:hover { background: #064A32; }
        .btn-modal-cancel { background: #ccc; color: #333; }
        .btn-modal-cancel:hover { background: #bbb; }

        /* Password Change Section */
        .password-section {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .password-section h2 { color: #856404; border-bottom-color: #ffc107; }
        .password-section .field label { color: #856404; }
        .password-section .btn-change-pass { background: #ffc107; color: #333; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .password-section .btn-change-pass:hover { background: #e0a800; }
        .pass-status { font-size: 13px; margin-top: 5px; }
        .pass-status.success { color: #0A6847; }
        .pass-status.error { color: #dc3545; }

        .toast { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; color: white; font-weight: bold; display: none; z-index: 999; }
        .toast.success { background: #0A6847; }
        .toast.error { background: #dc3545; }
        .toast.show { display: block; }

        .team-subsection { margin-top: 20px; }
        .team-subsection h3 { color: #064A32; font-size: 18px; margin-bottom: 10px; }

        @media (max-width: 600px) { .row { grid-template-columns: 1fr; } .header { flex-direction: column; text-align: center; } .item { flex-direction: column; text-align: center; } .item .info { flex-direction: column; } }
    </style>
</head>
<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <h1>🌱 SPAL Admin Panel</h1>
            <div class="header-actions">
                <button class="btn btn-save" onclick="saveAll()">💾 Save All</button>
                <button class="btn btn-export" onclick="exportData()">📤 Export Data</button>
                <button class="btn btn-import" onclick="document.getElementById('importFile').click()">📥 Import Data</button>
                <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)" />
                <button class="btn btn-view" onclick="window.open('../index.html','_blank')">👁️ View Site</button>
                <button class="btn btn-logout" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- PASSWORD CHANGE SECTION                      -->
        <!-- ========================================== -->
        <div class="password-section">
            <h2>🔐 Change Admin Password</h2>
            <div class="row">
                <div class="field">
                    <label>Current Password</label>
                    <input type="password" id="current_pass" placeholder="Enter current password" />
                </div>
                <div class="field">
                    <label>New Password</label>
                    <input type="password" id="new_pass" placeholder="Enter new password (min 4 characters)" />
                </div>
            </div>
            <div class="row">
                <div class="field">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirm_pass" placeholder="Confirm new password" />
                </div>
                <div style="display: flex; align-items: flex-end; padding-bottom: 12px;">
                    <button class="btn-change-pass" onclick="changePassword()">🔑 Change Password</button>
                </div>
            </div>
            <div id="passStatus" class="pass-status"></div>
        </div>

        <!-- ========================================== -->
        <!-- HOME                                        -->
        <!-- ========================================== -->
        <div class="section">
            <h2>🏠 Home Page</h2>
            <div class="field"><label>Hero Description</label><textarea id="home_desc" rows="2">Developing AI-powered drone systems and image processing solutions for sustainable agriculture and crop disease detection.</textarea></div>
            <div class="row">
                <div class="field"><label>Research Projects</label><input type="number" id="home_projects" value="15" /></div>
                <div class="field"><label>Publications</label><input type="number" id="home_pubs" value="45" /></div>
                <div class="field"><label>Team Members</label><input type="number" id="home_team" value="12" /></div>
                <div class="field"><label>Ongoing Projects</label><input type="number" id="home_ongoing" value="8" /></div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- ABOUT                                       -->
        <!-- ========================================== -->
        <div class="section">
            <h2>📖 About Page</h2>
            <div class="field"><label>Mission</label><textarea id="about_mission" rows="2">To advance precision agriculture through innovative research, AI-driven technologies, and sustainable farming practices that enhance food security and environmental stewardship.</textarea></div>
            <div class="field"><label>Vision</label><textarea id="about_vision" rows="2">To become a leading research lab in precision agriculture, transforming farming through intelligent systems, drone technology, and data-driven decision making.</textarea></div>
            <div class="field"><label>What We Do</label><input type="text" id="about_work" value="Develop AI models | Design autonomous drone systems | Deploy IoT sensors | Predictive modeling | Sustainable farming" /></div>
        </div>

        <!-- ========================================== -->
        <!-- PI                                          -->
        <!-- ========================================== -->
        <div class="section">
            <h2>👨‍🏫 Principal Investigator</h2>
            <div class="row">
                <div class="field"><label>Name</label><input type="text" id="pi_name" value="Dr. Md. Shaha Nur Kabir" /></div>
                <div class="field"><label>Title</label><input type="text" id="pi_title" value="Professor &amp; Principal Investigator" /></div>
            </div>
            <div class="field"><label>Department</label><input type="text" id="pi_dept" value="Department of Agricultural &amp; Industrial Engineering (AIE), HSTU, Dinajpur" /></div>
            <div class="row">
                <div class="field"><label>Email</label><input type="email" id="pi_email" value="kabir1982@hstu.ac.bd" /></div>
                <div class="field"><label>Phone</label><input type="text" id="pi_phone" value="+8801737676930" /></div>
            </div>
            <div class="field"><label>Bio</label><textarea id="pi_bio" rows="3">Dr. Md. Shaha Nur Kabir is a Professor and the Principal Investigator of the Smart Precision Agriculture Lab (SPAL). He leads cutting-edge research in precision agriculture technologies, focusing on AI, drone systems, and machine vision for sustainable agricultural practices.</textarea></div>
            <div class="field"><label>Research Interests</label><input type="text" id="pi_interests" value="Smart Farming using AI, Precision Agriculture, Machinery Testing, Controlled Environment Agriculture" /></div>
            <div class="field"><label>Education</label><input type="text" id="pi_education" value="PhD (2015) - Chungnam National University | M.S. (2008) - BAU | B.Sc. (2006) - BAU" /></div>
        </div>

        <!-- ========================================== -->
        <!-- TEAM MEMBERS                               -->
        <!-- ========================================== -->
        <div class="section">
            <h2>👥 Team Members</h2>
            <div class="team-subsection">
                <h3>🟢 Current Members</h3>
                <button class="btn-add" onclick="openModal('team', null, 'current')">+ Add Current Member</button>
                <div id="currentTeamList" class="item-list"></div>
            </div>
            <div class="team-subsection" style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #eef2f7;">
                <h3>🎓 Alumni</h3>
                <button class="btn-add" onclick="openModal('team', null, 'alumni')">+ Add Alumni</button>
                <div id="alumniTeamList" class="item-list"></div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- PUBLICATIONS                                -->
        <!-- ========================================== -->
        <div class="section">
            <h2>📄 Publications</h2>
            <button class="btn-add" onclick="openModal('publication')">+ Add Publication</button>
            <div id="pubList" class="item-list"></div>
        </div>

        <!-- ========================================== -->
        <!-- NEWS                                        -->
        <!-- ========================================== -->
        <div class="section">
            <h2>📰 News</h2>
            <button class="btn-add" onclick="openModal('news')">+ Add News</button>
            <div id="newsList" class="item-list"></div>
        </div>

        <!-- ========================================== -->
        <!-- AWARDS                                      -->
        <!-- ========================================== -->
        <div class="section">
            <h2>🏆 Awards</h2>
            <button class="btn-add" onclick="openModal('award')">+ Add Award</button>
            <div id="awardList" class="item-list"></div>
        </div>

    </div>

    <!-- ========================================== -->
    <!-- MODAL                                       -->
    <!-- ========================================== -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add New</h2>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button class="btn-modal-save" onclick="saveModal()">Save</button>
                <button class="btn-modal-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==========================================
        // DATA
        // ==========================================
        let data = {
            team: [
                { id: 1, name: 'Md Faruk Hossain', role: 'Research Assistant', bio: 'AIoT, Smart Farming', category: 'current', image: 'faruk.jpg' },
                { id: 2, name: 'Kazi Md Mehedi Hasan', role: 'Research Assistant', bio: 'IoT, Sensor Networks', category: 'current', image: 'mehedi.jpg' },
                { id: 3, name: 'Rayhan Mahmud', role: 'Research Assistant', bio: 'Drone Systems, ML', category: 'current', image: 'rayhan.jpg' },
                { id: 4, name: 'Digonta Chandra Roy', role: 'Research Assistant', bio: 'AI, Drone Systems', category: 'current', image: 'digonta.jpg' },
                { id: 5, name: 'Md Mamunur Rashid', role: 'MS Student', bio: 'CNU, South Korea', category: 'alumni', image: 'rashid.jpg' },
                { id: 6, name: 'Md Ashikur Rahman', role: 'MS Student', bio: 'CNU, South Korea', category: 'alumni', image: 'ashikur.jpg' },
                { id: 7, name: 'Md Sakib Robin', role: 'MS Student', bio: 'CNU, South Korea', category: 'alumni', image: 'robin.jpg' }
            ],
            publications: [
                { id: 1, title: 'Smart Evaporative Cooling Storage System', authors: 'Mahmud, M.R., et al.', journal: 'IOCAG 2025', year: 2025, doi: '10.1234/example' }
            ],
            news: [
                { id: 1, title: 'SPAL Lab Launch', date: '2025-01-15', content: 'SPAL officially launched at HSTU.', author: 'Admin', image: 'news1.jpg', link: 'https://example.com/news1', doi: '10.1234/news1' }
            ],
            awards: [
                { id: 1, title: 'Best Paper Award – IOCAG 2025' }
            ]
        };

        let modalType = '', editId = null, modalCategory = null;

        // ==========================================
        // PASSWORD CHANGE FUNCTION
        // ==========================================
        function changePassword() {
            const current = document.getElementById('current_pass').value;
            const newPass = document.getElementById('new_pass').value;
            const confirmPass = document.getElementById('confirm_pass').value;
            const statusDiv = document.getElementById('passStatus');

            // Get stored password (or use default)
            let storedPassword = localStorage.getItem('admin_password');
            if (!storedPassword) {
                localStorage.setItem('admin_password', 'spal2025');
                storedPassword = 'spal2025';
            }

            // Validate
            if (current !== storedPassword) {
                statusDiv.className = 'pass-status error';
                statusDiv.textContent = '❌ Current password is incorrect!';
                return;
            }

            if (newPass.length < 4) {
                statusDiv.className = 'pass-status error';
                statusDiv.textContent = '❌ New password must be at least 4 characters!';
                return;
            }

            if (newPass !== confirmPass) {
                statusDiv.className = 'pass-status error';
                statusDiv.textContent = '❌ Passwords do not match!';
                return;
            }

            // Save new password
            localStorage.setItem('admin_password', newPass);
            statusDiv.className = 'pass-status success';
            statusDiv.textContent = '✅ Password changed successfully!';

            // Clear fields
            document.getElementById('current_pass').value = '';
            document.getElementById('new_pass').value = '';
            document.getElementById('confirm_pass').value = '';

            showToast('✅ Password changed successfully!', 'success');
        }

        // Enter key support for password change
        document.getElementById('confirm_pass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') changePassword();
        });

        // ==========================================
        // LOAD / SAVE
        // ==========================================
        function loadData() {
            try {
                const saved = localStorage.getItem('spal_admin_data');
                if (saved) { data = JSON.parse(saved); }
            } catch (e) {}
            renderAll();
            loadFields();
        }

        function saveData() {
            try { localStorage.setItem('spal_admin_data', JSON.stringify(data)); } catch (e) {}
        }

        function savePageFields() {
            const pageData = {
                home_desc: document.getElementById('home_desc').value,
                home_projects: document.getElementById('home_projects').value,
                home_pubs: document.getElementById('home_pubs').value,
                home_team: document.getElementById('home_team').value,
                home_ongoing: document.getElementById('home_ongoing').value,
                about_mission: document.getElementById('about_mission').value,
                about_vision: document.getElementById('about_vision').value,
                about_work: document.getElementById('about_work').value,
                pi_name: document.getElementById('pi_name').value,
                pi_title: document.getElementById('pi_title').value,
                pi_dept: document.getElementById('pi_dept').value,
                pi_email: document.getElementById('pi_email').value,
                pi_phone: document.getElementById('pi_phone').value,
                pi_bio: document.getElementById('pi_bio').value,
                pi_interests: document.getElementById('pi_interests').value,
                pi_education: document.getElementById('pi_education').value
            };
            try { localStorage.setItem('spal_page_data', JSON.stringify(pageData)); } catch (e) {}
        }

        function loadFields() {
            try {
                const saved = localStorage.getItem('spal_page_data');
                if (saved) {
                    const d = JSON.parse(saved);
                    document.getElementById('home_desc').value = d.home_desc || '';
                    document.getElementById('home_projects').value = d.home_projects || 15;
                    document.getElementById('home_pubs').value = d.home_pubs || 45;
                    document.getElementById('home_team').value = d.home_team || 12;
                    document.getElementById('home_ongoing').value = d.home_ongoing || 8;
                    document.getElementById('about_mission').value = d.about_mission || '';
                    document.getElementById('about_vision').value = d.about_vision || '';
                    document.getElementById('about_work').value = d.about_work || '';
                    document.getElementById('pi_name').value = d.pi_name || '';
                    document.getElementById('pi_title').value = d.pi_title || '';
                    document.getElementById('pi_dept').value = d.pi_dept || '';
                    document.getElementById('pi_email').value = d.pi_email || '';
                    document.getElementById('pi_phone').value = d.pi_phone || '';
                    document.getElementById('pi_bio').value = d.pi_bio || '';
                    document.getElementById('pi_interests').value = d.pi_interests || '';
                    document.getElementById('pi_education').value = d.pi_education || '';
                }
            } catch (e) {}
        }

        function saveAll() {
            saveData();
            savePageFields();
            showToast('✅ All content saved successfully!', 'success');
        }

        // ==========================================
        // EXPORT DATA
        // ==========================================
        function exportData() {
            const pageData = localStorage.getItem('spal_page_data');
            const adminData = localStorage.getItem('spal_admin_data');
            
            const exportObj = {
                exportedAt: new Date().toISOString(),
                version: '1.0',
                pageData: pageData ? JSON.parse(pageData) : null,
                adminData: adminData ? JSON.parse(adminData) : null
            };
            
            const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `spal_data_backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('✅ Data exported successfully!', 'success');
        }

        // ==========================================
        // IMPORT DATA
        // ==========================================
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!imported.pageData && !imported.adminData) {
                        showToast('❌ Invalid file format!', 'error');
                        return;
                    }
                    if (!confirm('This will overwrite ALL current data. Continue?')) return;
                    
                    if (imported.pageData) {
                        localStorage.setItem('spal_page_data', JSON.stringify(imported.pageData));
                    }
                    if (imported.adminData) {
                        localStorage.setItem('spal_admin_data', JSON.stringify(imported.adminData));
                        if (imported.adminData.team) data.team = imported.adminData.team;
                        if (imported.adminData.publications) data.publications = imported.adminData.publications;
                        if (imported.adminData.news) data.news = imported.adminData.news;
                        if (imported.adminData.awards) data.awards = imported.adminData.awards;
                    }
                    
                    showToast('✅ Data imported! Refreshing...', 'success');
                    setTimeout(() => { location.reload(); }, 1500);
                } catch (err) {
                    showToast('❌ Error: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ==========================================
        // RENDER
        // ==========================================
        function renderAll() {
            renderTeam();
            renderList('pubList', data.publications, 'publication');
            renderNewsList();
            renderList('awardList', data.awards, 'award');
        }

        function renderTeam() {
            const currentContainer = document.getElementById('currentTeamList');
            const currentMembers = data.team.filter(m => m.category === 'current');
            if (currentMembers.length === 0) {
                currentContainer.innerHTML = '<p style="color:#999; padding:10px;">No current members added.</p>';
            } else {
                let html = '';
                currentMembers.forEach(item => {
                    const image = item.image || 'default.jpg';
                    html += `
                        <div class="item">
                            <div class="info">
                                <img src="../images/${image}" alt="${item.name}" onerror="this.src='../images/default.jpg'" />
                                <div class="text">
                                    <strong>${item.name}</strong>
                                    <div class="detail">${item.role} · <span class="category-badge current">Current</span></div>
                                </div>
                            </div>
                            <div class="actions">
                                <button class="btn-edit" onclick="openModal('team', ${item.id})">Edit</button>
                                <button class="btn-delete" onclick="deleteItem('team', ${item.id})">Delete</button>
                            </div>
                        </div>
                    `;
                });
                currentContainer.innerHTML = html;
            }

            const alumniContainer = document.getElementById('alumniTeamList');
            const alumniMembers = data.team.filter(m => m.category === 'alumni');
            if (alumniMembers.length === 0) {
                alumniContainer.innerHTML = '<p style="color:#999; padding:10px;">No alumni added.</p>';
            } else {
                let html = '';
                alumniMembers.forEach(item => {
                    const image = item.image || 'default.jpg';
                    html += `
                        <div class="item">
                            <div class="info">
                                <img src="../images/${image}" alt="${item.name}" onerror="this.src='../images/default.jpg'" />
                                <div class="text">
                                    <strong>${item.name}</strong>
                                    <div class="detail">${item.role} · <span class="category-badge alumni">Alumni</span></div>
                                </div>
                            </div>
                            <div class="actions">
                                <button class="btn-edit" onclick="openModal('team', ${item.id})">Edit</button>
                                <button class="btn-delete" onclick="deleteItem('team', ${item.id})">Delete</button>
                            </div>
                        </div>
                    `;
                });
                alumniContainer.innerHTML = html;
            }
        }

        function renderNewsList() {
            const container = document.getElementById('newsList');
            if (!data.news || data.news.length === 0) {
                container.innerHTML = '<p style="color:#999; padding:10px;">No news added.</p>';
                return;
            }
            let html = '';
            data.news.forEach(item => {
                const image = item.image || '';
                html += `
                    <div class="item">
                        <div class="info">
                            ${image ? `<img src="../images/${image}" alt="${item.title}" onerror="this.style.display='none'" />` : ''}
                            <div class="text">
                                <strong>${item.title}</strong>
                                <div class="detail">${item.date} · ${item.author}</div>
                                <div class="links">
                                    ${item.doi ? `<span>DOI: ${item.doi}</span>` : ''}
                                    ${item.link ? `<a href="${item.link}" target="_blank">🔗 Link</a>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-edit" onclick="openModal('news', ${item.id})">Edit</button>
                            <button class="btn-delete" onclick="deleteItem('news', ${item.id})">Delete</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderList(id, items, type) {
            const container = document.getElementById(id);
            if (!items || items.length === 0) {
                container.innerHTML = '<p style="color:#999; padding:10px;">No items added.</p>';
                return;
            }
            let html = '';
            items.forEach(item => {
                let info = item.name || item.title || '';
                let detail = item.role || item.authors || item.date || '';
                let doi = item.doi ? `<span style="font-size:11px; color:#0A6847;">DOI: ${item.doi}</span>` : '';
                html += `
                    <div class="item">
                        <div class="info">
                            <div class="text">
                                <strong>${info}</strong>
                                <div class="detail">${detail}</div>
                                ${doi ? `<div class="links">${doi}</div>` : ''}
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-edit" onclick="openModal('${type}', ${item.id})">Edit</button>
                            <button class="btn-delete" onclick="deleteItem('${type}', ${item.id})">Delete</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ==========================================
        // MODAL
        // ==========================================
        function openModal(type, id = null, category = null) {
            modalType = type;
            editId = id;
            modalCategory = category;
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            let item = null;
            if (id) {
                const list = data[type + 's'] || data[type];
                item = list.find(i => i.id === id);
            }

            let fields = '';
            if (type === 'team') {
                title.textContent = id ? '✏️ Edit Team Member' : '👥 Add Team Member';
                const image = item ? item.image : '';
                const categoryValue = item ? item.category : (category || 'current');
                fields = `
                    <div class="field"><label>Name</label><input type="text" id="f_name" value="${item ? item.name : ''}" /></div>
                    <div class="field"><label>Role</label><input type="text" id="f_role" value="${item ? item.role : ''}" /></div>
                    <div class="field"><label>Bio</label><input type="text" id="f_bio" value="${item ? item.bio : ''}" /></div>
                    <div class="field">
                        <label>Category</label>
                        <select id="f_category">
                            <option value="current" ${categoryValue === 'current' ? 'selected' : ''}>Current Member</option>
                            <option value="alumni" ${categoryValue === 'alumni' ? 'selected' : ''}>Alumni</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Image</label>
                        <div class="image-upload-wrapper">
                            <input type="file" id="f_image_file" accept=".jpg,.jpeg,.png" />
                            <span style="font-size:12px; color:#666;">or enter filename:</span>
                            <input type="text" id="f_image" value="${image}" placeholder="e.g. faruk.jpg" style="width:200px;" />
                        </div>
                        <div style="margin-top:5px;">
                            ${image ? `<img src="../images/${image}" class="image-preview" id="imagePreview" onerror="this.style.display='none'" />` : `<img src="" class="image-preview" id="imagePreview" style="display:none;" />`}
                        </div>
                        <div style="font-size:12px; color:#666; margin-top:5px;">Supported: JPG, PNG, JPEG</div>
                    </div>
                `;
            } else if (type === 'publication') {
                title.textContent = id ? '✏️ Edit Publication' : '📄 Add Publication';
                const doi = item ? item.doi : '';
                fields = `
                    <div class="field"><label>Title</label><input type="text" id="f_title" value="${item ? item.title : ''}" /></div>
                    <div class="field"><label>Authors</label><input type="text" id="f_authors" value="${item ? item.authors : ''}" /></div>
                    <div class="field"><label>Journal</label><input type="text" id="f_journal" value="${item ? item.journal : ''}" /></div>
                    <div class="field"><label>Year</label><input type="number" id="f_year" value="${item ? item.year : ''}" /></div>
                    <div class="field"><label>DOI</label><input type="text" id="f_doi" value="${doi}" placeholder="e.g. 10.1234/example" /></div>
                `;
            } else if (type === 'news') {
                title.textContent = id ? '✏️ Edit News' : '📰 Add News';
                const image = item ? item.image : '';
                const link = item ? item.link : '';
                const doi = item ? item.doi : '';
                fields = `
                    <div class="field"><label>Title</label><input type="text" id="f_title" value="${item ? item.title : ''}" /></div>
                    <div class="field"><label>Date</label><input type="date" id="f_date" value="${item ? item.date : ''}" /></div>
                    <div class="field"><label>Content</label><textarea id="f_content">${item ? item.content : ''}</textarea></div>
                    <div class="field"><label>Author</label><input type="text" id="f_author" value="${item ? item.author : ''}" /></div>
                    <div class="field">
                        <label>Image</label>
                        <div class="image-upload-wrapper">
                            <input type="file" id="f_image_file" accept=".jpg,.jpeg,.png" />
                            <span style="font-size:12px; color:#666;">or enter filename:</span>
                            <input type="text" id="f_image" value="${image}" placeholder="e.g. news1.jpg" style="width:200px;" />
                        </div>
                        <div style="margin-top:5px;">
                            ${image ? `<img src="../images/${image}" class="image-preview" id="imagePreview" onerror="this.style.display='none'" />` : `<img src="" class="image-preview" id="imagePreview" style="display:none;" />`}
                        </div>
                        <div style="font-size:12px; color:#666; margin-top:5px;">Supported: JPG, PNG, JPEG</div>
                    </div>
                    <div class="field"><label>Hyperlink</label><input type="url" id="f_link" value="${link}" placeholder="https://example.com/news" /></div>
                    <div class="field"><label>DOI</label><input type="text" id="f_doi" value="${doi}" placeholder="e.g. 10.1234/news1" /></div>
                `;
            } else if (type === 'award') {
                title.textContent = id ? '✏️ Edit Award' : '🏆 Add Award';
                fields = `
                    <div class="field"><label>Title</label><input type="text" id="f_title" value="${item ? item.title : ''}" /></div>
                `;
            }

            body.innerHTML = fields;
            modal.classList.add('active');

            const fileInput = document.getElementById('f_image_file');
            if (fileInput) {
                fileInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const preview = document.getElementById('imagePreview');
                            preview.src = ev.target.result;
                            preview.style.display = 'block';
                            document.getElementById('f_image').value = file.name;
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            modalType = '';
            editId = null;
            modalCategory = null;
        }

        function saveModal() {
            const type = modalType;
            const id = editId;
            const list = data[type + 's'] || data[type];

            let newItem = {};
            if (type === 'team') {
                const imageField = document.getElementById('f_image');
                const fileInput = document.getElementById('f_image_file');
                let imageValue = imageField.value || 'default.jpg';
                if (fileInput && fileInput.files.length > 0) {
                    imageValue = fileInput.files[0].name;
                }
                newItem = {
                    name: document.getElementById('f_name').value,
                    role: document.getElementById('f_role').value,
                    bio: document.getElementById('f_bio').value,
                    category: document.getElementById('f_category').value,
                    image: imageValue
                };
            } else if (type === 'publication') {
                newItem = {
                    title: document.getElementById('f_title').value,
                    authors: document.getElementById('f_authors').value,
                    journal: document.getElementById('f_journal').value,
                    year: parseInt(document.getElementById('f_year').value) || null,
                    doi: document.getElementById('f_doi').value || ''
                };
            } else if (type === 'news') {
                const imageField = document.getElementById('f_image');
                const fileInput = document.getElementById('f_image_file');
                let imageValue = imageField.value || '';
                if (fileInput && fileInput.files.length > 0) {
                    imageValue = fileInput.files[0].name;
                }
                newItem = {
                    title: document.getElementById('f_title').value,
                    date: document.getElementById('f_date').value,
                    content: document.getElementById('f_content').value,
                    author: document.getElementById('f_author').value,
                    image: imageValue,
                    link: document.getElementById('f_link').value || '',
                    doi: document.getElementById('f_doi').value || ''
                };
            } else if (type === 'award') {
                newItem = { title: document.getElementById('f_title').value };
            }

            if (id) {
                const index = list.findIndex(i => i.id === id);
                if (index !== -1) list[index] = { ...list[index], ...newItem };
            } else {
                newItem.id = Date.now();
                list.push(newItem);
            }

            saveData();
            renderAll();
            closeModal();
            showToast('✅ Saved successfully!', 'success');
        }

        function deleteItem(type, id) {
            if (!confirm('Delete this item?')) return;
            const list = data[type + 's'] || data[type];
            data[type + 's'] = list.filter(i => i.id !== id);
            saveData();
            renderAll();
            showToast('🗑️ Deleted!', 'success');
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => { t.classList.remove('show'); }, 3000);
        }

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            window.location.href = 'index.html';
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        loadData();
    </script>

</body>
</html>
