<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPAL Admin – Edit Content</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            padding: 20px;
            color: #1a1a2e;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid #eef2f7;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            font-size: 28px;
            color: #064A32;
        }
        .header h1 span {
            color: #0A6847;
        }
        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: #0A6847;
            color: white;
        }
        .btn-primary:hover {
            background: #064A32;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
        .btn-warning {
            background: #ffc107;
            color: #1a1a2e;
        }
        .btn-warning:hover {
            background: #e0a800;
            transform: translateY(-2px);
        }

        /* Editor Sections */
        .editor-section {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #eef2f7;
        }
        .editor-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .editor-section .section-header h2 {
            font-size: 20px;
            color: #1a1a2e;
        }
        .editor-section .section-header .badge {
            font-size: 12px;
            background: #e8f5e9;
            color: #0A6847;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .editor-field {
            margin-bottom: 14px;
        }
        .editor-field label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        .editor-field input,
        .editor-field textarea,
        .editor-field select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: 0.3s;
        }
        .editor-field input:focus,
        .editor-field textarea:focus {
            outline: none;
            border-color: #0A6847;
            box-shadow: 0 0 0 4px rgba(10,104,71,0.1);
        }
        .editor-field textarea {
            resize: vertical;
            min-height: 60px;
        }
        .editor-field .hint {
            font-size: 11px;
            color: #6c757d;
            margin-top: 2px;
        }

        .editor-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* List Items */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #eef2f7;
            flex-wrap: wrap;
            gap: 10px;
        }
        .list-item .item-info {
            flex: 1;
        }
        .list-item .item-info strong {
            font-size: 14px;
        }
        .list-item .item-info .item-detail {
            font-size: 12px;
            color: #6c757d;
        }
        .list-item .item-actions {
            display: flex;
            gap: 6px;
        }
        .list-item .item-actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-add-item {
            padding: 8px 18px;
            background: #0A6847;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
        }
        .btn-add-item:hover {
            background: #064A32;
            transform: translateY(-2px);
        }

        .empty-msg {
            color: #6c757d;
            font-style: italic;
            padding: 15px 0;
            text-align: center;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            margin: 20px;
        }
        .modal-content h2 {
            margin-bottom: 15px;
            color: #064A32;
        }
        .modal-content input,
        .modal-content textarea,
        .modal-content select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            font-family: inherit;
            font-size: 14px;
        }
        .modal-content input:focus,
        .modal-content textarea:focus {
            outline: none;
            border-color: #0A6847;
        }
        .modal-content .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }
        .modal-content .modal-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .modal-content .modal-actions .btn-save-modal {
            background: #0A6847;
            color: white;
        }
        .modal-content .modal-actions .btn-save-modal:hover {
            background: #064A32;
        }
        .modal-content .modal-actions .btn-cancel-modal {
            background: #e9ecef;
            color: #333;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            z-index: 2000;
            display: none;
            animation: slideIn 0.3s ease;
        }
        .toast.success {
            background: #0A6847;
        }
        .toast.error {
            background: #dc3545;
        }
        .toast.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .editor-row {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .modal-content {
                padding: 20px;
                margin: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <div class="container">

        <!-- ========================================== -->
        <!-- HEADER                                     -->
        <!-- ========================================== -->
        <div class="header">
            <h1>🌱 <span>SPAL</span> Admin Panel</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="saveAllContent()">
                    <i class="fas fa-save"></i> Save All Changes
                </button>
                <a href="../index.html" target="_blank" class="btn btn-primary">
                    <i class="fas fa-external-link-alt"></i> View Site
                </a>
                <button class="btn btn-danger" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- HOME PAGE CONTENT                          -->
        <!-- ========================================== -->
        <div class="editor-section">
            <div class="section-header">
                <h2>🏠 Home Page</h2>
                <span class="badge">Editable</span>
            </div>
            <div class="editor-field">
                <label>Hero Description</label>
                <textarea id="home_hero_desc" rows="2">Developing AI-powered drone systems and image processing solutions for sustainable agriculture and crop disease detection.</textarea>
            </div>
            <div class="editor-row">
                <div class="editor-field">
                    <label>Research Projects</label>
                    <input type="number" id="home_projects" value="15" />
                </div>
                <div class="editor-field">
                    <label>Publications</label>
                    <input type="number" id="home_pubs" value="45" />
                </div>
                <div class="editor-field">
                    <label>Team Members</label>
                    <input type="number" id="home_team" value="12" />
                </div>
                <div class="editor-field">
                    <label>Ongoing Projects</label>
                    <input type="number" id="home_ongoing" value="8" />
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- ABOUT PAGE                                 -->
        <!-- ========================================== -->
        <div class="editor-section">
            <div class="section-header">
                <h2>📖 About Page</h2>
                <span class="badge">Editable</span>
            </div>
            <div class="editor-field">
                <label>Mission</label>
                <textarea id="about_mission" rows="2">To advance precision agriculture through innovative research, AI-driven technologies, and sustainable farming practices that enhance food security and environmental stewardship.</textarea>
            </div>
            <div class="editor-field">
                <label>Vision</label>
                <textarea id="about_vision" rows="2">To become a leading research lab in precision agriculture, transforming farming through intelligent systems, drone technology, and data-driven decision making.</textarea>
            </div>
            <div class="editor-field">
                <label>What We Do (separate with | )</label>
                <input type="text" id="about_work" value="Develop AI models for crop disease detection | Design autonomous drone spraying systems | Deploy IoT sensors for real-time field monitoring | Create predictive models for agricultural machinery | Promote sustainable farming practices" />
            </div>
        </div>

        <!-- ========================================== -->
        <!-- PI PAGE                                    -->
        <!-- ========================================== -->
        <div class="editor-section">
            <div class="section-header">
                <h2>👨‍🏫 PI Page</h2>
                <span class="badge">Editable</span>
            </div>
            <div class="editor-row">
                <div class="editor-field">
                    <label>Name</label>
                    <input type="text" id="pi_name" value="Dr. Md. Shaha Nur Kabir" />
                </div>
                <div class="editor-field">
                    <label>Title</label>
                    <input type="text" id="pi_title" value="Professor &amp; Principal Investigator" />
                </div>
            </div>
            <div class="editor-field">
                <label>Department</label>
                <input type="text" id="pi_dept" value="Department of Agricultural &amp; Industrial Engineering (AIE), Faculty of Engineering, HSTU, Dinajpur" />
            </div>
            <div class="editor-row">
                <div class="editor-field">
                    <label>Email</label>
                    <input type="email" id="pi_email" value="kabir1982@hstu.ac.bd" />
                </div>
                <div class="editor-field">
                    <label>Phone</label>
                    <input type="text" id="pi_phone" value="+8801737676930" />
                </div>
            </div>
            <div class="editor-field">
                <label>Bio</label>
                <textarea id="pi_bio" rows="3">Dr. Md. Shaha Nur Kabir is a Professor and the Principal Investigator of the Smart Precision Agriculture Lab (SPAL). He leads cutting-edge research in precision agriculture technologies, focusing on AI, drone systems, and machine vision for sustainable agricultural practices.</textarea>
            </div>
            <div class="editor-field">
                <label>Research Interests (comma separated)</label>
                <input type="text" id="pi_interests" value="Smart Farming using AI, Precision Agriculture Technologies, Standardized testing of agricultural machinery, Safety and comfort of agricultural machinery, Controlled environment agriculture, Post-harvest technologies, Supply and value chain analysis" />
            </div>
            <div class="editor-field">
                <label>Education (separate with | )</label>
                <input type="text" id="pi_education" value="Doctor of Philosophy, 2015 – Chungnam National University, South Korea | M.S. in Farm Power and Machinery, 2008 – BAU, Mymensingh | B.Sc. in Agricultural Engineering, 2006 – BAU, Mymensingh" />
            </div>
        </div>

        <!-- ========================================== -->
        <!-- RESEARCH AREAS                             -->
        <!-- ========================================== -->
        <div class="editor-section">
            <div class="section-header">
                <h2>🔬 Research Areas</h2>
                <button class="btn-add-item" onclick="openModal('research')">
                    <i class="fas fa-plus"></i> Add Research
                </button>
            </div>
            <div id="researchList"></div>
        </div>

        <!-- ========================================== -->
        <!-- TEAM MEMBERS                               -->
        <!-- ========================================== -->
        <div class="editor-section">
            <div class="section-header">
                <h2>👥 Team Members</h2>
                <button class="btn-add-item" onclick="openModal('team')">
                    <i class="fas fa-plus"></i> Add Member
                </button>
            </div>
            <div id="teamList"></div>
        </div>

        <!-- ========================================== -->
        <!-- PUBLICATIONS                               -->
        <!-- ========================================== -->
        <div class="editor-section">
            <div class="section-header">
                <h2>📄 Publications</h2>
                <button class="btn-add-item" onclick="openModal('publication')">
                    <i class="fas fa-plus"></i> Add Publication
                </button>
            </div>
            <div id="publicationList"></div>
        </div>

        <!-- ========================================== -->
        <!-- NEWS                                       -->
        <!-- ========================================== -->
        <div class="editor-section">
            <div class="section-header">
                <h2>📰 News</h2>
                <button class="btn-add-item" onclick="openModal('news')">
                    <i class="fas fa-plus"></i> Add News
                </button>
            </div>
            <div id="newsList"></div>
        </div>

        <!-- ========================================== -->
        <!-- AWARDS                                     -->
        <!-- ========================================== -->
        <div class="editor-section">
            <div class="section-header">
                <h2>🏆 Awards &amp; Achievements</h2>
                <button class="btn-add-item" onclick="openModal('award')">
                    <i class="fas fa-plus"></i> Add Award
                </button>
            </div>
            <div id="awardList"></div>
        </div>

    </div>

    <!-- ========================================== -->
    <!-- MODAL                                      -->
    <!-- ========================================== -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add New</h2>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button class="btn-save-modal" onclick="saveModal()"><i class="fas fa-save"></i> Save</button>
                <button class="btn-cancel-modal" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // DATA MANAGEMENT
        // ==========================================
        let contentData = {
            research: [
                { id: 1, title: 'Drone-Based Spraying', icon: '🚁', description: 'Developing autonomous drone systems for targeted pesticide application and precision spraying in agricultural fields.', status: 'active' },
                { id: 2, title: 'AI Disease Detection', icon: '🧠', description: 'Deep learning models for real-time detection of crop diseases and nutrient deficiencies using image processing.', status: 'active' },
                { id: 3, title: 'IoT & Smart Sensors', icon: '🛰️', description: 'Deploying IoT sensor networks for soil health monitoring, weather prediction, and automated irrigation systems.', status: 'active' },
                { id: 4, title: 'Predictive Modeling', icon: '📊', description: 'ARX and machine learning models for predicting engine power, crop yield, and optimizing agricultural machinery.', status: 'ongoing' }
            ],
            team: [
                { id: 1, name: 'Md Faruk Hossain', role: 'Research Assistant', bio: 'AIoT, Smart Farming, Image Processing', category: 'current' },
                { id: 2, name: 'Kazi Md Mehedi Hasan', role: 'Research Assistant', bio: 'IoT, Sensor Networks, Precision Agriculture', category: 'current' },
                { id: 3, name: 'Rayhan Mahmud', role: 'Research Assistant', bio: 'Drone Systems, Machine Learning, Post-Harvest', category: 'current' },
                { id: 4, name: 'Md Musa', role: 'Research Assistant', bio: 'Agricultural Machinery, Data Collection', category: 'current' },
                { id: 5, name: 'Md Fahim', role: 'Research Assistant', bio: 'Machine Learning, Computer Vision', category: 'current' },
                { id: 6, name: 'Digonta Chandra Roy', role: 'Research Assistant', bio: 'AI, Drone Systems, Image Processing', category: 'current' },
                { id: 7, name: 'Md Mamunur Rashid', role: 'MS Student', bio: 'Chungnam National University, South Korea', category: 'alumni' },
                { id: 8, name: 'Md Ashikur Rahman', role: 'MS Student', bio: 'Chungnam National University, South Korea', category: 'alumni' },
                { id: 9, name: 'Md Sakib Robin', role: 'MS Student', bio: 'Chungnam National University, South Korea', category: 'alumni' }
            ],
            publications: [
                { id: 1, title: 'Development of a Low-Cost, Solar-Powered Smart Evaporative Cooling Storage System', authors: 'Mahmud, M. R., et al.', journal: 'IOCAG 2025, MDPI', year: 2025, link: 'https://sciforum.net/paper/view/24829' },
                { id: 2, title: 'Smartphone-Based Potato Disease Detection Using Image Processing Technique', authors: 'Saha, D., et al.', journal: 'GAUIC 2025', year: 2025 },
                { id: 3, title: 'AIoT System for Real-Time Smart Monitoring of Rice Field Conditions', authors: 'Hossain, M. F., et al.', journal: 'GAUIC 2025', year: 2025 }
            ],
            news: [
                { id: 1, title: 'SPAL Lab Launch', date: '2025-01-15', content: 'Smart Precision Agriculture Lab officially launched at HSTU.', author: 'Admin' }
            ],
            awards: [
                { id: 1, title: 'Best Paper Award – IOCAG 2025' },
                { id: 2, title: 'Research Excellence Award – HSTU, 2024' },
                { id: 3, title: 'Innovation in Agriculture Award – BARC, 2023' }
            ]
        };

        let currentModalType = '';
        let currentEditId = null;

        // Load data from localStorage
        function loadData() {
            const saved = localStorage.getItem('spal_content_data');
            if (saved) {
                try {
                    contentData = JSON.parse(saved);
                } catch (e) {
                    console.warn('Failed to parse saved data');
                }
            }
            renderAll();
        }

        function saveData() {
            localStorage.setItem('spal_content_data', JSON.stringify(contentData));
            updateStats();
        }

        // ==========================================
        // RENDER FUNCTIONS
        // ==========================================
        function renderAll() {
            renderResearch();
            renderTeam();
            renderPublications();
            renderNews();
            renderAwards();
            updateStats();
            loadFormData();
        }

        function renderResearch() {
            const container = document.getElementById('researchList');
            if (!contentData.research || contentData.research.length === 0) {
                container.innerHTML = '<p class="empty-msg">No research areas added.</p>';
                return;
            }
            let html = '';
            contentData.research.forEach(r => {
                html += `
                    <div class="list-item">
                        <div class="item-info">
                            <strong>${r.icon || '🔬'} ${r.title}</strong>
                            <div class="item-detail">${r.description.substring(0, 80)}${r.description.length > 80 ? '...' : ''} <span style="background:#e8f5e9;padding:1px 10px;border-radius:12px;font-size:11px;">${r.status}</span></div>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit-item" onclick="editItem('research', ${r.id})">Edit</button>
                            <button class="btn-delete-item" onclick="deleteItem('research', ${r.id})">Delete</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderTeam() {
            const container = document.getElementById('teamList');
            if (!contentData.team || contentData.team.length === 0) {
                container.innerHTML = '<p class="empty-msg">No team members added.</p>';
                return;
            }
            let html = '';
            contentData.team.forEach(m => {
                html += `
                    <div class="list-item">
                        <div class="item-info">
                            <strong>${m.name}</strong>
                            <div class="item-detail">${m.role} · ${m.category} · ${m.bio}</div>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit-item" onclick="editItem('team', ${m.id})">Edit</button>
                            <button class="btn-delete-item" onclick="deleteItem('team', ${m.id})">Delete</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderPublications() {
            const container = document.getElementById('publicationList');
            if (!contentData.publications || contentData.publications.length === 0) {
                container.innerHTML = '<p class="empty-msg">No publications added.</p>';
                return;
            }
            let html = '';
            contentData.publications.forEach(p => {
                html += `
                    <div class="list-item">
                        <div class="item-info">
                            <strong>${p.title}</strong>
                            <div class="item-detail">${p.authors} · ${p.journal} (${p.year})</div>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit-item" onclick="editItem('publication', ${p.id})">Edit</button>
                            <button class="btn-delete-item" onclick="deleteItem('publication', ${p.id})">Delete</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderNews() {
            const container = document.getElementById('newsList');
            if (!contentData.news || contentData.news.length === 0) {
                container.innerHTML = '<p class="empty-msg">No news added.</p>';
                return;
            }
            let html = '';
            contentData.news.forEach(n => {
                html += `
                    <div class="list-item">
                        <div class="item-info">
                            <strong>${n.title}</strong>
                            <div class="item-detail">${n.date} · ${n.author}</div>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit-item" onclick="editItem('news', ${n.id})">Edit</button>
                            <button class="btn-delete-item" onclick="deleteItem('news', ${n.id})">Delete</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderAwards() {
            const container = document.getElementById('awardList');
            if (!contentData.awards || contentData.awards.length === 0) {
                container.innerHTML = '<p class="empty-msg">No awards added.</p>';
                return;
            }
            let html = '';
            contentData.awards.forEach(a => {
                html += `
                    <div class="list-item">
                        <div class="item-info">
                            <strong>🏆 ${a.title}</strong>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit-item" onclick="editItem('award', ${a.id})">Edit</button>
                            <button class="btn-delete-item" onclick="deleteItem('award', ${a.id})">Delete</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateStats() {
            document.getElementById('totalTeam').textContent = contentData.team ? contentData.team.length : 0;
            document.getElementById('totalPubs').textContent = contentData.publications ? contentData.publications.length : 0;
            document.getElementById('totalNews').textContent = contentData.news ? contentData.news.length : 0;
            document.getElementById('totalResearch').textContent = contentData.research ? contentData.research.length : 0;
            document.getElementById('totalAwards').textContent = contentData.awards ? contentData.awards.length : 0;
        }

        // ==========================================
        // FORM DATA (Load/Save Page Content)
        // ==========================================
        function loadFormData() {
            const saved = localStorage.getItem('spal_page_content');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    document.getElementById('home_hero_desc').value = data.home_hero_desc || '';
                    document.getElementById('home_projects').value = data.home_projects || 15;
                    document.getElementById('home_pubs').value = data.home_pubs || 45;
                    document.getElementById('home_team').value = data.home_team || 12;
                    document.getElementById('home_ongoing').value = data.home_ongoing || 8;
                    document.getElementById('about_mission').value = data.about_mission || '';
                    document.getElementById('about_vision').value = data.about_vision || '';
                    document.getElementById('about_work').value = data.about_work || '';
                    document.getElementById('pi_name').value = data.pi_name || '';
                    document.getElementById('pi_title').value = data.pi_title || '';
                    document.getElementById('pi_dept').value = data.pi_dept || '';
                    document.getElementById('pi_email').value = data.pi_email || '';
                    document.getElementById('pi_phone').value = data.pi_phone || '';
                    document.getElementById('pi_bio').value = data.pi_bio || '';
                    document.getElementById('pi_interests').value = data.pi_interests || '';
                    document.getElementById('pi_education').value = data.pi_education || '';
                } catch (e) {
                    console.warn('Failed to load page content');
                }
            }
        }

        function savePageContent() {
            const data = {
                home_hero_desc: document.getElementById('home_hero_desc').value,
                home_projects: document.getElementById('home_projects').value,
                home_pubs: document.getElementById('home_pubs').value,
                home_team: document.getElementById('home_team').value,
                home_ongoing: document.getElementById('home_ongoing').value,
                about_mission: document.getElementById('about_mission').value,
                about_vision: document.getElementById('about_vision').value,
                about_work: document.getElementById('about_work').value,
                pi_name: document.getElementById('pi_name').value,
                pi_title: document.getElementById('pi_title').value,
                pi_dept: document.getElementById('pi_dept').value,
                pi_email: document.getElementById('pi_email').value,
                pi_phone: document.getElementById('pi_phone').value,
                pi_bio: document.getElementById('pi_bio').value,
                pi_interests: document.getElementById('pi_interests').value,
                pi_education: document.getElementById('pi_education').value
            };
            localStorage.setItem('spal_page_content', JSON.stringify(data));
            return data;
        }

        // ==========================================
        // SAVE ALL
        // ==========================================
        function saveAllContent() {
            saveData();
            savePageContent();
            showToast('✅ All content saved successfully!', 'success');
        }

        // ==========================================
        // MODAL OPERATIONS
        // ==========================================
        function openModal(type, editId = null) {
            currentModalType = type;
            currentEditId = editId;
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            let fields = '';
            let data = null;

            if (type === 'research') {
                title.textContent = editId ? '✏️ Edit Research' : '🔬 Add Research';
                data = editId ? contentData.research.find(r => r.id === editId) : {};
                fields = `
                    <input type="text" id="f_title" value="${data.title || ''}" placeholder="Title" />
                    <input type="text" id="f_icon" value="${data.icon || '🚁'}" placeholder="Icon (emoji)" />
                    <textarea id="f_description" placeholder="Description">${data.description || ''}</textarea>
                    <select id="f_status">
                        <option value="active" ${data.status === 'active' ? 'selected' : ''}>Active</option>
                        <option value="ongoing" ${data.status === 'ongoing' ? 'selected' : ''}>Ongoing</option>
                        <option value="completed" ${data.status === 'completed' ? 'selected' : ''}>Completed</option>
                    </select>
                `;
            } else if (type === 'team') {
                title.textContent = editId ? '✏️ Edit Team Member' : '👥 Add Team Member';
                data = editId ? contentData.team.find(m => m.id === editId) : {};
                fields = `
                    <input type="text" id="f_name" value="${data.name || ''}" placeholder="Full Name" />
                    <input type="text" id="f_role" value="${data.role || ''}" placeholder="Role" />
                    <input type="text" id="f_bio" value="${data.bio || ''}" placeholder="Bio" />
                    <select id="f_category">
                        <option value="current" ${data.category === 'current' ? 'selected' : ''}>Current Member</option>
                        <option value="alumni" ${data.category === 'alumni' ? 'selected' : ''}>Alumni</option>
                    </select>
                `;
            } else if (type === 'publication') {
                title.textContent = editId ? '✏️ Edit Publication' : '📄 Add Publication';
                data = editId ? contentData.publications.find(p => p.id === editId) : {};
                fields = `
                    <input type="text" id="f_title" value="${data.title || ''}" placeholder="Title" />
                    <input type="text" id="f_authors" value="${data.authors || ''}" placeholder="Authors" />
                    <input type="text" id="f_journal" value="${data.journal || ''}" placeholder="Journal" />
                    <input type="number" id="f_year" value="${data.year || ''}" placeholder="Year" />
                    <input type="text" id="f_link" value="${data.link || ''}" placeholder="Link (URL)" />
                `;
            } else if (type === 'news') {
                title.textContent = editId ? '✏️ Edit News' : '📰 Add News';
                data = editId ? contentData.news.find(n => n.id === editId) : {};
                fields = `
                    <input type="text" id="f_title" value="${data.title || ''}" placeholder="Title" />
                    <input type="date" id="f_date" value="${data.date || ''}" />
                    <textarea id="f_content" placeholder="Content">${data.content || ''}</textarea>
                    <input type="text" id="f_author" value="${data.author || ''}" placeholder="Author" />
                `;
            } else if (type === 'award') {
                title.textContent = editId ? '✏️ Edit Award' : '🏆 Add Award';
                data = editId ? contentData.awards.find(a => a.id === editId) : {};
                fields = `
                    <input type="text" id="f_title" value="${data.title || ''}" placeholder="Award Title" />
                `;
            }

            body.innerHTML = fields;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            currentModalType = '';
            currentEditId = null;
        }

        function saveModal() {
            const type = currentModalType;
            const editId = currentEditId;

            if (type === 'research') {
                const newItem = {
                    title: document.getElementById('f_title').value,
                    icon: document.getElementById('f_icon').value || '🔬',
                    description: document.getElementById('f_description').value,
                    status: document.getElementById('f_status').value
                };
                if (editId) {
                    const index = contentData.research.findIndex(r => r.id === editId);
                    if (index !== -1) contentData.research[index] = { ...contentData.research[index], ...newItem };
                } else {
                    newItem.id = Date.now();
                    contentData.research.push(newItem);
                }
            } else if (type === 'team') {
                const newItem = {
                    name: document.getElementById('f_name').value,
                    role: document.getElementById('f_role').value,
                    bio: document.getElementById('f_bio').value,
                    category: document.getElementById('f_category').value
                };
                if (editId) {
                    const index = contentData.team.findIndex(m => m.id === editId);
                    if (index !== -1) contentData.team[index] = { ...contentData.team[index], ...newItem };
                } else {
                    newItem.id = Date.now();
                    contentData.team.push(newItem);
                }
            } else if (type === 'publication') {
                const newItem = {
                    title: document.getElementById('f_title').value,
                    authors: document.getElementById('f_authors').value,
                    journal: document.getElementById('f_journal').value,
                    year: parseInt(document.getElementById('f_year').value) || null,
                    link: document.getElementById('f_link').value
                };
                if (editId) {
                    const index = contentData.publications.findIndex(p => p.id === editId);
                    if (index !== -1) contentData.publications[index] = { ...contentData.publications[index], ...newItem };
                } else {
                    newItem.id = Date.now();
                    contentData.publications.push(newItem);
                }
            } else if (type === 'news') {
                const newItem = {
                    title: document.getElementById('f_title').value,
                    date: document.getElementById('f_date').value,
                    content: document.getElementById('f_content').value,
                    author: document.getElementById('f_author').value
                };
                if (editId) {
                    const index = contentData.news.findIndex(n => n.id === editId);
                    if (index !== -1) contentData.news[index] = { ...contentData.news[index], ...newItem };
                } else {
                    newItem.id = Date.now();
                    contentData.news.push(newItem);
                }
            } else if (type === 'award') {
                const newItem = {
                    title: document.getElementById('f_title').value
                };
                if (editId) {
                    const index = contentData.awards.findIndex(a => a.id === editId);
                    if (index !== -1) contentData.awards[index] = { ...contentData.awards[index], ...newItem };
                } else {
                    newItem.id = Date.now();
                    contentData.awards.push(newItem);
                }
            }

            saveData();
            renderAll();
            closeModal();
            showToast('✅ Item saved successfully!', 'success');
        }

        // ==========================================
        // EDIT / DELETE ITEMS
        // ==========================================
        function editItem(type, id) {
            openModal(type, id);
        }

        function deleteItem(type, id) {
            if (!confirm('Are you sure you want to delete this item?')) return;

            if (type === 'research') contentData.research = contentData.research.filter(r => r.id !== id);
            else if (type === 'team') contentData.team = contentData.team.filter(m => m.id !== id);
            else if (type === 'publication') contentData.publications = contentData.publications.filter(p => p.id !== id);
            else if (type === 'news') contentData.news = contentData.news.filter(n => n.id !== id);
            else if (type === 'award') contentData.awards = contentData.awards.filter(a => a.id !== id);

            saveData();
            renderAll();
            showToast('🗑️ Item deleted successfully!', 'success');
        }

        // ==========================================
        // TOAST NOTIFICATION
        // ==========================================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // ==========================================
        // LOGOUT
        // ==========================================
        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            window.location.href = 'index.html';
        }

        // ==========================================
        // INIT
        // ==========================================
        loadData();
    </script>

</body>
</html>
