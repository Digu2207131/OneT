<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPAL Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }

        .header {
            background: #0A6847; color: white; padding: 20px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;
        }
        .header h1 { font-size: 22px; }
        .btn {
            padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px;
        }
        .btn-save { background: #FFC107; color: #333; }
        .btn-save:hover { background: #e0a800; }
        .btn-sync { background: #17a2b8; color: white; }
        .btn-sync:hover { background: #138496; }
        .btn-load { background: #6f42c1; color: white; }
        .btn-load:hover { background: #5a32a3; }
        .btn-view { background: white; color: #0A6847; }
        .btn-view:hover { background: #e0e0e0; }
        .btn-logout { background: #dc3545; color: white; }
        .btn-logout:hover { background: #c82333; }

        .section {
            background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .section h2 {
            color: #0A6847; border-bottom: 2px solid #e8f5e9; padding-bottom: 10px; margin-bottom: 15px;
            font-size: 18px;
        }

        .field { margin-bottom: 12px; }
        .field label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
        .field input, .field textarea, .field select {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px;
            font-family: Arial, sans-serif;
        }
        .field textarea { min-height: 60px; resize: vertical; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .item-list { margin-top: 10px; }
        .item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: #f9f9f9; border-radius: 5px; margin-bottom: 5px;
            border: 1px solid #eee;
        }
        .item .info { flex: 1; }
        .item .info strong { font-size: 14px; display: block; }
        .item .info .detail { font-size: 12px; color: #666; }
        .item .actions { display: flex; gap: 5px; }
        .item .actions button {
            padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;
        }
        .btn-edit { background: #ffc107; }
        .btn-edit:hover { background: #e0a800; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-delete:hover { background: #c82333; }
        .btn-add {
            background: #0A6847; color: white; padding: 6px 14px; border: none; border-radius: 5px;
            cursor: pointer; font-weight: bold; font-size: 13px; margin-top: 10px;
        }
        .btn-add:hover { background: #064A32; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white; padding: 30px; border-radius: 10px; max-width: 500px; width: 90%;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-content h2 { margin-bottom: 15px; color: #0A6847; }
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
        .modal-actions button {
            padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px;
        }
        .btn-modal-save { background: #0A6847; color: white; }
        .btn-modal-cancel { background: #ccc; color: #333; }

        .toast {
            position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 8px;
            color: white; font-weight: bold; display: none; z-index: 999;
        }
        .toast.success { background: #0A6847; }
        .toast.error { background: #dc3545; }
        .toast.show { display: block; }

        .team-subsection { margin-top: 20px; }
        .team-subsection h3 { color: #064A32; font-size: 18px; margin-bottom: 10px; }

        @media (max-width: 600px) {
            .row { grid-template-columns: 1fr; }
            .header { flex-direction: column; text-align: center; }
            .item { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <h1>🌱 SPAL Admin</h1>
            <div>
                <button class="btn btn-save" onclick="saveAll()">💾 Save</button>
                <button class="btn btn-sync" onclick="saveToJSONBin()">☁️ Sync to Cloud</button>
                <button class="btn btn-load" onclick="loadFromJSONBin()">⬇️ Load from Cloud</button>
                <button class="btn btn-view" onclick="window.open('../index.html','_blank')">👁️ View</button>
                <button class="btn btn-logout" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- Password Change -->
        <div class="section" style="background:#fff3cd; border:2px solid #ffc107;">
            <h2 style="color:#856404; border-bottom-color:#ffc107;">🔐 Change Password</h2>
            <div class="row">
                <div class="field"><label>Current Password</label><input type="password" id="current_pass" placeholder="Current password" /></div>
                <div class="field"><label>New Password</label><input type="password" id="new_pass" placeholder="New password" /></div>
            </div>
            <div class="row">
                <div class="field"><label>Confirm New Password</label><input type="password" id="confirm_pass" placeholder="Confirm new password" /></div>
                <div style="display:flex; align-items:flex-end; padding-bottom:12px;">
                    <button class="btn-add" onclick="changePassword()">Change Password</button>
                </div>
            </div>
            <div id="passStatus" style="font-size:13px; margin-top:5px;"></div>
        </div>

        <!-- HOME -->
        <div class="section">
            <h2>🏠 Home</h2>
            <div class="field"><label>Hero Description</label><textarea id="home_desc" rows="2">Developing AI-powered drone systems and image processing solutions for sustainable agriculture.</textarea></div>
            <div class="row">
                <div class="field"><label>Projects</label><input type="number" id="home_projects" value="15" /></div>
                <div class="field"><label>Publications</label><input type="number" id="home_pubs" value="45" /></div>
                <div class="field"><label>Team</label><input type="number" id="home_team" value="12" /></div>
                <div class="field"><label>Ongoing</label><input type="number" id="home_ongoing" value="8" /></div>
            </div>
        </div>

        <!-- ABOUT -->
        <div class="section">
            <h2>📖 About</h2>
            <div class="field"><label>Mission</label><textarea id="about_mission" rows="2">To advance precision agriculture through innovative research, AI-driven technologies, and sustainable farming practices.</textarea></div>
            <div class="field"><label>Vision</label><textarea id="about_vision" rows="2">To become a leading research lab in precision agriculture.</textarea></div>
            <div class="field"><label>What We Do</label><input type="text" id="about_work" value="Develop AI models | Design drone systems | Deploy IoT sensors" /></div>
        </div>

        <!-- PI -->
        <div class="section">
            <h2>👨‍🏫 PI</h2>
            <div class="row">
                <div class="field"><label>Name</label><input type="text" id="pi_name" value="Dr. Md. Shaha Nur Kabir" /></div>
                <div class="field"><label>Title</label><input type="text" id="pi_title" value="Professor &amp; PI" /></div>
            </div>
            <div class="field"><label>Department</label><input type="text" id="pi_dept" value="Dept. of AIE, HSTU, Dinajpur" /></div>
            <div class="row">
                <div class="field"><label>Email</label><input type="email" id="pi_email" value="kabir1982@hstu.ac.bd" /></div>
                <div class="field"><label>Phone</label><input type="text" id="pi_phone" value="+8801737676930" /></div>
            </div>
            <div class="field"><label>Bio</label><textarea id="pi_bio" rows="3">Dr. Md. Shaha Nur Kabir is a Professor and Principal Investigator of SPAL.</textarea></div>
        </div>

        <!-- TEAM -->
        <div class="section">
            <h2>👥 Team Members</h2>
            <div class="team-subsection">
                <h3>🟢 Current Members</h3>
                <button class="btn-add" onclick="openModal('team', null, 'current')">+ Add Current</button>
                <div id="currentTeamList" class="item-list"></div>
            </div>
            <div class="team-subsection" style="margin-top:30px; padding-top:20px; border-top:2px solid #eef2f7;">
                <h3>🎓 Alumni</h3>
                <button class="btn-add" onclick="openModal('team', null, 'alumni')">+ Add Alumni</button>
                <div id="alumniTeamList" class="item-list"></div>
            </div>
        </div>

        <!-- PUBLICATIONS -->
        <div class="section">
            <h2>📄 Publications</h2>
            <button class="btn-add" onclick="openModal('publication')">+ Add</button>
            <div id="pubList" class="item-list"></div>
        </div>

        <!-- NEWS -->
        <div class="section">
            <h2>📰 News</h2>
            <button class="btn-add" onclick="openModal('news')">+ Add</button>
            <div id="newsList" class="item-list"></div>
        </div>

        <!-- AWARDS -->
        <div class="section">
            <h2>🏆 Awards</h2>
            <button class="btn-add" onclick="openModal('award')">+ Add</button>
            <div id="awardList" class="item-list"></div>
        </div>

    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add New</h2>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button class="btn-modal-save" onclick="saveModal()">Save</button>
                <button class="btn-modal-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==========================================
        // JSONBIN CONFIGURATION
        // ==========================================
        const BIN_ID = '6a6cebf2da38895dfea9c438';
        const API_KEY = 'YOUR_API_KEY_HERE'; // ← Replace with your API Key!

        // ==========================================
        // DATA
        // ==========================================
        let data = {
            team: [
                { id: 1, name: 'Md Faruk Hossain', role: 'Research Assistant', bio: 'AIoT, Smart Farming', category: 'current' },
                { id: 2, name: 'Kazi Md Mehedi Hasan', role: 'Research Assistant', bio: 'IoT, Sensor Networks', category: 'current' },
                { id: 3, name: 'Rayhan Mahmud', role: 'Research Assistant', bio: 'Drone Systems, ML', category: 'current' },
                { id: 4, name: 'Digonta Chandra Roy', role: 'Research Assistant', bio: 'AI, Drone Systems', category: 'current' },
                { id: 5, name: 'Md Mamunur Rashid', role: 'MS Student', bio: 'CNU, South Korea', category: 'alumni' },
                { id: 6, name: 'Md Ashikur Rahman', role: 'MS Student', bio: 'CNU, South Korea', category: 'alumni' },
                { id: 7, name: 'Md Sakib Robin', role: 'MS Student', bio: 'CNU, South Korea', category: 'alumni' }
            ],
            publications: [
                { id: 1, title: 'Smart Evaporative Cooling Storage System', authors: 'Mahmud, M.R., et al.', journal: 'IOCAG 2025', year: 2025 }
            ],
            news: [
                { id: 1, title: 'SPAL Lab Launch', date: '2025-01-15', content: 'SPAL officially launched.', author: 'Admin' }
            ],
            awards: [
                { id: 1, title: 'Best Paper Award – IOCAG 2025' }
            ]
        };

        let modalType = '', editId = null, modalCategory = null;

        // ==========================================
        // PASSWORD CHANGE
        // ==========================================
        function changePassword() {
            const current = document.getElementById('current_pass').value;
            const newPass = document.getElementById('new_pass').value;
            const confirmPass = document.getElementById('confirm_pass').value;
            const status = document.getElementById('passStatus');

            let stored = localStorage.getItem('admin_password');
            if (!stored) { localStorage.setItem('admin_password', 'spal2025'); stored = 'spal2025'; }

            if (current !== stored) { status.innerHTML = '❌ Current password incorrect!'; status.style.color = '#dc3545'; return; }
            if (newPass.length < 4) { status.innerHTML = '❌ Password must be at least 4 characters!'; status.style.color = '#dc3545'; return; }
            if (newPass !== confirmPass) { status.innerHTML = '❌ Passwords do not match!'; status.style.color = '#dc3545'; return; }

            localStorage.setItem('admin_password', newPass);
            status.innerHTML = '✅ Password changed successfully!';
            status.style.color = '#0A6847';
            document.getElementById('current_pass').value = '';
            document.getElementById('new_pass').value = '';
            document.getElementById('confirm_pass').value = '';
            showToast('✅ Password changed!', 'success');
        }

        // ==========================================
        // JSONBIN FUNCTIONS
        // ==========================================
        function saveToJSONBin() {
            const dataStr = localStorage.getItem('spal_admin_data');
            if (!dataStr) {
                showToast('❌ No data to sync!', 'error');
                return;
            }

            showToast('☁️ Syncing to cloud...', 'success');

            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: dataStr
            })
            .then(res => res.json())
            .then(data => {
                if (data.message === 'success' || data.message === 'record') {
                    console.log('✅ Synced to JSONBin!', data);
                    showToast('✅ Synced to cloud!', 'success');
                } else {
                    console.error('Sync error:', data);
                    showToast('❌ Sync failed: ' + JSON.stringify(data), 'error');
                }
            })
            .catch(err => {
                console.error('Sync error:', err);
                showToast('❌ Sync error: ' + err.message, 'error');
            });
        }

        function loadFromJSONBin() {
            showToast('⬇️ Loading from cloud...', 'success');

            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            })
            .then(res => res.json())
            .then(data => {
                if (data.record && data.record.team) {
                    localStorage.setItem('spal_admin_data', JSON.stringify(data.record));
                    // Update local data
                    data = data.record;
                    renderAll();
                    loadFields();
                    console.log('✅ Loaded from cloud!', data);
                    showToast('✅ Data loaded from cloud!', 'success');
                } else {
                    console.warn('No cloud data:', data);
                    showToast('⚠️ No cloud data found.', 'error');
                }
            })
            .catch(err => {
                console.error('Load error:', err);
                showToast('❌ Load error: ' + err.message, 'error');
            });
        }

        // ==========================================
        // LOAD / SAVE
        // ==========================================
        function loadData() {
            try {
                const saved = localStorage.getItem('spal_admin_data');
                if (saved) {
                    data = JSON.parse(saved);
                    console.log('✅ Data loaded from localStorage:', data);
                } else {
                    // Save initial data
                    localStorage.setItem('spal_admin_data', JSON.stringify(data));
                }
            } catch(e) {
                console.warn('Load error:', e);
                localStorage.setItem('spal_admin_data', JSON.stringify(data));
            }
            loadFields();
            renderAll();
        }

        function saveData() {
            try {
                localStorage.setItem('spal_admin_data', JSON.stringify(data));
                console.log('✅ Data saved to localStorage:', data);
            } catch(e) {
                showToast('❌ Error saving!', 'error');
            }
        }

        function savePageFields() {
            const pageData = {
                home_desc: document.getElementById('home_desc').value,
                home_projects: document.getElementById('home_projects').value,
                home_pubs: document.getElementById('home_pubs').value,
                home_team: document.getElementById('home_team').value,
                home_ongoing: document.getElementById('home_ongoing').value,
                about_mission: document.getElementById('about_mission').value,
                about_vision: document.getElementById('about_vision').value,
                about_work: document.getElementById('about_work').value,
                pi_name: document.getElementById('pi_name').value,
                pi_title: document.getElementById('pi_title').value,
                pi_dept: document.getElementById('pi_dept').value,
                pi_email: document.getElementById('pi_email').value,
                pi_phone: document.getElementById('pi_phone').value,
                pi_bio: document.getElementById('pi_bio').value
            };
            try { localStorage.setItem('spal_page_data', JSON.stringify(pageData)); } catch(e) {}
        }

        function loadFields() {
            try {
                const saved = localStorage.getItem('spal_page_data');
                if (saved) {
                    const d = JSON.parse(saved);
                    document.getElementById('home_desc').value = d.home_desc || '';
                    document.getElementById('home_projects').value = d.home_projects || 15;
                    document.getElementById('home_pubs').value = d.home_pubs || 45;
                    document.getElementById('home_team').value = d.home_team || 12;
                    document.getElementById('home_ongoing').value = d.home_ongoing || 8;
                    document.getElementById('about_mission').value = d.about_mission || '';
                    document.getElementById('about_vision').value = d.about_vision || '';
                    document.getElementById('about_work').value = d.about_work || '';
                    document.getElementById('pi_name').value = d.pi_name || '';
                    document.getElementById('pi_title').value = d.pi_title || '';
                    document.getElementById('pi_dept').value = d.pi_dept || '';
                    document.getElementById('pi_email').value = d.pi_email || '';
                    document.getElementById('pi_phone').value = d.pi_phone || '';
                    document.getElementById('pi_bio').value = d.pi_bio || '';
                }
            } catch(e) {}
        }

        function saveAll() {
            saveData();
            savePageFields();
            showToast('✅ Saved to local!', 'success');
        }

        // ==========================================
        // RENDER
        // ==========================================
        function renderAll() {
            renderTeam();
            renderList('pubList', data.publications, 'publication');
            renderNewsList();
            renderList('awardList', data.awards, 'award');
        }

        function renderTeam() {
            const currentContainer = document.getElementById('currentTeamList');
            const currentMembers = data.team.filter(m => m.category === 'current');
            if (currentMembers.length === 0) {
                currentContainer.innerHTML = '<p style="color:#999; padding:10px;">No current members.</p>';
            } else {
                let html = '';
                currentMembers.forEach(item => {
                    html += `
                        <div class="item">
                            <div class="info">
                                <strong>${item.name}</strong>
                                <span class="detail">${item.role} · <span style="background:#e8f5e9; padding:2px 12px; border-radius:12px; font-size:11px;">Current</span></span>
                            </div>
                            <div class="actions">
                                <button class="btn-edit" onclick="openModal('team', ${item.id})">Edit</button>
                                <button class="btn-delete" onclick="deleteItem('team', ${item.id})">Delete</button>
                            </div>
                        </div>
                    `;
                });
                currentContainer.innerHTML = html;
            }

            const alumniContainer = document.getElementById('alumniTeamList');
            const alumniMembers = data.team.filter(m => m.category === 'alumni');
            if (alumniMembers.length === 0) {
                alumniContainer.innerHTML = '<p style="color:#999; padding:10px;">No alumni.</p>';
            } else {
                let html = '';
                alumniMembers.forEach(item => {
                    html += `
                        <div class="item">
                            <div class="info">
                                <strong>${item.name}</strong>
                                <span class="detail">${item.role} · <span style="background:#fff3e0; padding:2px 12px; border-radius:12px; font-size:11px;">Alumni</span></span>
                            </div>
                            <div class="actions">
                                <button class="btn-edit" onclick="openModal('team', ${item.id})">Edit</button>
                                <button class="btn-delete" onclick="deleteItem('team', ${item.id})">Delete</button>
                            </div>
                        </div>
                    `;
                });
                alumniContainer.innerHTML = html;
            }
        }

        function renderNewsList() {
            const container = document.getElementById('newsList');
            if (!data.news || data.news.length === 0) {
                container.innerHTML = '<p style="color:#999; padding:10px;">No news.</p>';
            } else {
                let html = '';
                data.news.forEach(item => {
                    html += `
                        <div class="item">
                            <div class="info">
                                <strong>${item.title}</strong>
                                <span class="detail">${item.date} · ${item.author}</span>
                            </div>
                            <div class="actions">
                                <button class="btn-edit" onclick="openModal('news', ${item.id})">Edit</button>
                                <button class="btn-delete" onclick="deleteItem('news', ${item.id})">Delete</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        }

        function renderList(id, items, type) {
            const container = document.getElementById(id);
            if (!items || items.length === 0) {
                container.innerHTML = '<p style="color:#999; padding:10px;">No items.</p>';
            } else {
                let html = '';
                items.forEach(item => {
                    let name = item.name || item.title || '';
                    let detail = item.role || item.authors || item.date || '';
                    html += `
                        <div class="item">
                            <div class="info">
                                <strong>${name}</strong>
                                <span class="detail">${detail}</span>
                            </div>
                            <div class="actions">
                                <button class="btn-edit" onclick="openModal('${type}', ${item.id})">Edit</button>
                                <button class="btn-delete" onclick="deleteItem('${type}', ${item.id})">Delete</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        }

        // ==========================================
        // MODAL
        // ==========================================
        function openModal(type, id = null, category = null) {
            modalType = type;
            editId = id;
            modalCategory = category;
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            let item = null;
            if (id) {
                const list = data[type + 's'] || data[type];
                item = list.find(i => i.id === id);
            }

            let fields = '';
            if (type === 'team') {
                title.textContent = id ? '✏️ Edit Team Member' : '👥 Add Team Member';
                const categoryValue = item ? item.category : (category || 'current');
                fields = `
                    <div class="field"><label>Name</label><input type="text" id="f_name" value="${item ? item.name : ''}" /></div>
                    <div class="field"><label>Role</label><input type="text" id="f_role" value="${item ? item.role : ''}" /></div>
                    <div class="field"><label>Bio</label><input type="text" id="f_bio" value="${item ? item.bio : ''}" /></div>
                    <div class="field">
                        <label>Category</label>
                        <select id="f_category">
                            <option value="current" ${categoryValue === 'current' ? 'selected' : ''}>Current</option>
                            <option value="alumni" ${categoryValue === 'alumni' ? 'selected' : ''}>Alumni</option>
                        </select>
                    </div>
                `;
            } else if (type === 'publication') {
                title.textContent = id ? '✏️ Edit Publication' : '📄 Add Publication';
                fields = `
                    <div class="field"><label>Title</label><input type="text" id="f_title" value="${item ? item.title : ''}" /></div>
                    <div class="field"><label>Authors</label><input type="text" id="f_authors" value="${item ? item.authors : ''}" /></div>
                    <div class="field"><label>Journal</label><input type="text" id="f_journal" value="${item ? item.journal : ''}" /></div>
                    <div class="field"><label>Year</label><input type="number" id="f_year" value="${item ? item.year : ''}" /></div>
                `;
            } else if (type === 'news') {
                title.textContent = id ? '✏️ Edit News' : '📰 Add News';
                const link = item ? item.link : '';
                const doi = item ? item.doi : '';
                fields = `
                    <div class="field"><label>Title</label><input type="text" id="f_title" value="${item ? item.title : ''}" /></div>
                    <div class="field"><label>Date</label><input type="date" id="f_date" value="${item ? item.date : ''}" /></div>
                    <div class="field"><label>Content</label><textarea id="f_content">${item ? item.content : ''}</textarea></div>
                    <div class="field"><label>Author</label><input type="text" id="f_author" value="${item ? item.author : ''}" /></div>
                    <div class="field"><label>Link</label><input type="url" id="f_link" value="${link}" placeholder="https://example.com" /></div>
                    <div class="field"><label>DOI</label><input type="text" id="f_doi" value="${doi}" placeholder="10.1234/example" /></div>
                `;
            } else if (type === 'award') {
                title.textContent = id ? '✏️ Edit Award' : '🏆 Add Award';
                fields = `
                    <div class="field"><label>Title</label><input type="text" id="f_title" value="${item ? item.title : ''}" /></div>
                `;
            }

            body.innerHTML = fields;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            modalType = '';
            editId = null;
            modalCategory = null;
        }

        function saveModal() {
            const type = modalType;
            const id = editId;
            const list = data[type + 's'] || data[type];

            let newItem = {};
            if (type === 'team') {
                newItem = {
                    name: document.getElementById('f_name').value,
                    role: document.getElementById('f_role').value,
                    bio: document.getElementById('f_bio').value,
                    category: document.getElementById('f_category').value
                };
            } else if (type === 'publication') {
                newItem = {
                    title: document.getElementById('f_title').value,
                    authors: document.getElementById('f_authors').value,
                    journal: document.getElementById('f_journal').value,
                    year: parseInt(document.getElementById('f_year').value) || null
                };
            } else if (type === 'news') {
                newItem = {
                    title: document.getElementById('f_title').value,
                    date: document.getElementById('f_date').value,
                    content: document.getElementById('f_content').value,
                    author: document.getElementById('f_author').value,
                    link: document.getElementById('f_link').value || '',
                    doi: document.getElementById('f_doi').value || ''
                };
            } else if (type === 'award') {
                newItem = { title: document.getElementById('f_title').value };
            }

            if (id) {
                const index = list.findIndex(i => i.id === id);
                if (index !== -1) list[index] = { ...list[index], ...newItem };
            } else {
                newItem.id = Date.now();
                list.push(newItem);
            }

            saveData();
            renderAll();
            closeModal();
            showToast('✅ Saved!', 'success');
        }

        function deleteItem(type, id) {
            if (!confirm('Delete this item?')) return;
            const list = data[type + 's'] || data[type];
            data[type + 's'] = list.filter(i => i.id !== id);
            saveData();
            renderAll();
            showToast('🗑️ Deleted!', 'success');
        }

        // ==========================================
        // TOAST
        // ==========================================
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => { t.classList.remove('show'); }, 3000);
        }

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            window.location.href = 'index.html';
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ==========================================
        // AUTO-SYNC ON SAVE
        // ==========================================
        const originalSaveAll = saveAll;
        saveAll = function() {
            originalSaveAll();
            // Don't auto-sync to cloud - user clicks Sync button manually
        };

        // ==========================================
        // LOAD CLOUD DATA ON STARTUP
        // ==========================================
        loadData();

        // Check if cloud data exists on load
        console.log('☁️ JSONBin ID:', BIN_ID);
        console.log('🔐 API Key set:', API_KEY !== '$2a$10$JBQB8l/d6lBlHbjzrZWU.eznCJarIMuZgfYV4VVEEuBqFyZhASMaS');
        if (API_KEY === '$2a$10$JBQB8l/d6lBlHbjzrZWU.eznCJarIMuZgfYV4VVEEuBqFyZhASMaS') {
            console.warn('⚠️ Please set your JSONBin API Key!');
        }
    </script>

</body>
